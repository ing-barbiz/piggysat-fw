# TF-M config
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General config
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ASSERT=y
CONFIG_ASSERT_NO_COND_INFO=y
CONFIG_ASSERT_NO_MSG_INFO=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_RESET_ON_FATAL_ERROR=y

# Test shell (backend selected per board, RTT on PiggySat)
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_LOG_BACKEND=y
# The NCS "lte" link-control commands clash with the test tool's "lte" command
CONFIG_LTE_SHELL=n
# Only "help" and the test commands: drop Zephyr's default shell commands
CONFIG_SHELL_CMDS=n
CONFIG_DATE_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_KERNEL_SHELL=n

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y
CONFIG_COAP=y
CONFIG_COAP_CLIENT=y
CONFIG_COAP_CLIENT_STACK_SIZE=4096
CONFIG_COAP_CLIENT_MESSAGE_SIZE=256
CONFIG_COAP_CLIENT_MESSAGE_HEADER_SIZE=64
CONFIG_COAP_CLIENT_MAX_PATH_LENGTH=96

# LTE link control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_DEFAULT=y

# Modem library
CONFIG_NRF_MODEM_LIB=y
CONFIG_NTN=y
CONFIG_MODEM_INFO=y
CONFIG_AT_MONITOR_HEAP_SIZE=2048

# Heap and stacks
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y

# LTE parameters
CONFIG_APP_APN="go.mono"
CONFIG_APP_MODEM_FW_EXPECTED="mfw_nrf9151-ntn"
CONFIG_APP_BAND_LOCK_LIST="255,256"
CONFIG_APP_NTN_LATITUDE="45.4064"
CONFIG_APP_NTN_LONGITUDE="11.8768"
CONFIG_APP_NTN_ALTITUDE_METERS="12.0"
CONFIG_APP_NTN_LOCATION_VALIDITY_SECONDS=43200

## PSM
CONFIG_APP_PSM_ENABLE=n

## eDRX
CONFIG_APP_EDRX_ENABLE=n

## Enable required LTE link control modules
CONFIG_LTE_LC_EDRX_MODULE=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_PSM_MODULE=y

# LTE message test
CONFIG_APP_TELEMETRY_MESSAGE="help"
CONFIG_APP_THINGSBOARD_HOST="coap.thingsboard.cloud"
CONFIG_APP_THINGSBOARD_IPV4=""
CONFIG_APP_THINGSBOARD_PORT=5683
# Access token: set it in secrets.conf (git-ignored), see secrets.conf.example
CONFIG_APP_LTE_ATTACH_TIMEOUT_SECONDS=600

# LTE CW TX test (band 255 uplink centre)
CONFIG_APP_CW_BAND=255
CONFIG_APP_CW_FREQUENCY_100KHZ=16435
CONFIG_APP_CW_POWER_DBM=23
