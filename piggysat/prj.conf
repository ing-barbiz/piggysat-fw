# TF-M
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Room for the satellite list logged every 3 s while searching
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_ASSERT=y
CONFIG_ASSERT_NO_COND_INFO=y
CONFIG_ASSERT_NO_MSG_INFO=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_RESET_ON_FATAL_ERROR=y

# Network (offloaded to the modem) and CoAP
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y
CONFIG_COAP=y
CONFIG_COAP_CLIENT=y
CONFIG_COAP_CLIENT_STACK_SIZE=4096
CONFIG_COAP_CLIENT_MESSAGE_SIZE=384
CONFIG_COAP_CLIENT_MESSAGE_HEADER_SIZE=64
CONFIG_COAP_CLIENT_MAX_PATH_LENGTH=96

# Modem, LTE link control and NTN
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_DEFAULT=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_NTN=y
CONFIG_AT_MONITOR_HEAP_SIZE=2048

# Kernel events (magnet.c)
CONFIG_EVENTS=y

# Heap and stacks
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Application
CONFIG_APP_REPORT_INTERVAL_SECONDS=300
CONFIG_APP_GNSS_FIX_TIMEOUT_SECONDS=180
CONFIG_APP_LTE_ATTACH_TIMEOUT_SECONDS=600
CONFIG_APP_SENT_LED_ON_SECONDS=30
CONFIG_APP_TELEMETRY_MESSAGE="piggysat"
CONFIG_APP_THINGSBOARD_HOST="coap.thingsboard.cloud"
CONFIG_APP_THINGSBOARD_PORT=5683
# Access token: set it in ../secrets.conf (git-ignored), see ../secrets.conf.example
CONFIG_APP_APN="go.mono"
CONFIG_APP_MODEM_FW_EXPECTED="mfw_nrf9151-ntn"
CONFIG_APP_BAND_LOCK_LIST="255,256"
